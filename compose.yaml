services:
  postgres:
    image: postgres:17-alpine
    container_name: aidirect-proof-postgres
    ports: ["127.0.0.1:55432:5432"]
    environment:
      POSTGRES_USER: aidirect
      POSTGRES_DB: aidirect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:local}
    volumes: ["aidirect_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidirect -d aidirect"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  aidirect_pg:
